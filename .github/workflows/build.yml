name: 编译本地播放器 IPA

# 手动触发；也可在推送时自动编译
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: 编译未签名 IPA（供免费 Apple ID 侧载）
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate --spec project.yml

      - name: 安装 CocoaPods 依赖（MobileVLCKit 较大，约 100MB）
        run: |
          pod install --repo-update

      - name: 显示可用 Scheme
        run: xcodebuild -list -workspace LocalPlayer.xcworkspace

      - name: Archive（不签名）
        run: |
          xcodebuild \
            -workspace LocalPlayer.xcworkspace \
            -scheme LocalPlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LocalPlayer.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive

      - name: 打包为 IPA
        run: |
          set -e
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/LocalPlayer.xcarchive/Products/Applications/LocalPlayer.app" Payload/
          zip -qry LocalPlayer.ipa Payload
          ls -lh LocalPlayer.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocalPlayer-IPA
          path: LocalPlayer.ipa
          retention-days: 90
